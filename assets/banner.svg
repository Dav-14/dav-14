  <radialGradient id="halo"><stop stop-color="#635bdf" stop-opacity=".27"/><stop offset="1" stop-color="#635bdf" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8aa1cd" opacity=".12"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
