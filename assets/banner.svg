<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">David Ragot — Backend · Platform · Observability</title>
<desc id="desc">A midnight blue canvas with large typography and a luminous system diagram connecting an API, Go services, infrastructure, and telemetry.</desc>
<defs>
